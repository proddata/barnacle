services:
  barnacle_batch_timeout:
    build: .
    environment:
      BARNACLE_LISTEN: ':8080'
      BARNACLE_PG_ADDR: postgres:5432
      BARNACLE_PG_ALLOWED_ADDRS: ''
      BARNACLE_PG_SSLMODE: require
      BARNACLE_PG_CA_FILE: /pgcerts/ca.crt
      BARNACLE_QUERY_TIMEOUT: 1500ms
    ports:
      - '127.0.0.1:8083:8080'
    volumes:
      - pgcerts:/pgcerts:ro
    depends_on:
      postgres:
        condition: service_healthy
  barnacle_batch_response_limit:
    build: .
    environment:
      BARNACLE_LISTEN: ':8080'
      BARNACLE_PG_ADDR: postgres:5432
      BARNACLE_PG_ALLOWED_ADDRS: ''
      BARNACLE_PG_SSLMODE: require
      BARNACLE_PG_CA_FILE: /pgcerts/ca.crt
      BARNACLE_HTTP_MAX_RESPONSE_MIB: '1'
    ports:
      - '127.0.0.1:8084:8080'
    volumes:
      - pgcerts:/pgcerts:ro
    depends_on:
      postgres:
        condition: service_healthy
