services:
  barnacle_ip:
    build: .
    environment:
      BARNACLE_LISTEN: ':8080'
      BARNACLE_PG_ADDR: '${BARNACLE_TEST_PG_IP:-127.0.0.1}:5432'
      BARNACLE_PG_TLS_SERVER_NAME: postgres
      BARNACLE_PG_SSLMODE: require
      BARNACLE_PG_CA_FILE: /pgcerts/ca.crt
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - pgcerts:/pgcerts:ro
    depends_on:
      postgres:
        condition: service_healthy
