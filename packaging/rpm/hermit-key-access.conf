# Opt-in fixed-user key-access variant. Install as
# /etc/systemd/system/hermit.service.d/key-access.conf.
# Provision the hermit system user/group and the host's service-key group first.
[Service]
DynamicUser=no
User=hermit
Group=hermit
SupplementaryGroups=hermit-service-keys
ReadOnlyPaths=/run/hermit/service-keys /etc/pki/hermit
