# Opt-in fixed-user key-access variant. Install as
# /etc/systemd/system/barnacle.service.d/key-access.conf.
# Provision the barnacle system user/group and the host's service-key group first.
[Service]
DynamicUser=no
User=barnacle
Group=barnacle
SupplementaryGroups=barnacle-service-keys
ReadOnlyPaths=/run/barnacle/service-keys /etc/pki/barnacle
