name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hermit
          POSTGRES_PASSWORD: hermit_dev_password
          POSTGRES_DB: hermit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermit -d hermit"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --prefix integration
      - name: Neon driver integration tests
        env:
          HERMIT_PG_ADDR: 127.0.0.1:5432
          HERMIT_PG_SSLMODE: disable
          HERMIT_PG_USER: hermit
          HERMIT_PG_DATABASE: hermit
          TEST_DATABASE_URL: postgres://hermit:hermit_dev_password@localhost:5432/hermit
        run: ./integration/run.sh
      - name: Neon driver request-based routing
        env:
          HERMIT_PG_ADDR: ''
          HERMIT_PG_ALLOWED_ADDRS: 127.0.0.1:5432
          HERMIT_PG_SSLMODE: disable
          TEST_DATABASE_URL: postgres://hermit:hermit_dev_password@127.0.0.1:5432/hermit
          HERMIT_ROUTING_ONLY: '1'
        run: ./integration/run.sh
      - run: docker compose config --quiet
      - run: docker build -t hermit:ci .
      - name: PostgreSQL TLS in Compose
        run: |
          trap 'docker compose down' EXIT
          docker compose up --build -d
          TEST_DATABASE_URL=postgres://hermit:hermit_dev_password@localhost:5432/hermit node integration/pg-tls.mjs
      - name: HTTPS and WSS through HAProxy
        run: ./integration/tls/run.sh

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hermit
          POSTGRES_PASSWORD: hermit_dev_password
          POSTGRES_DB: hermit
        options: >-
          --health-cmd "pg_isready -U hermit -d hermit"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - run: dnf install -y golang nodejs npm curl git
      - uses: actions/checkout@v7
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci --prefix integration
      - name: Neon driver integration tests on Fedora
        env:
          HERMIT_PG_ADDR: postgres:5432
          HERMIT_PG_SSLMODE: disable
          HERMIT_PG_USER: hermit
          HERMIT_PG_DATABASE: hermit
          TEST_DATABASE_URL: postgres://hermit:hermit_dev_password@postgres:5432/hermit
        run: ./integration/run.sh

  fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y golang git tar gzip rpm-build systemd-rpm-macros
      - uses: actions/checkout@v7
      - name: Build Fedora RPM
        run: ./packaging/rpm/build.sh
      - name: Inspect RPM contents
        run: |
          rpm -qpl dist/hermit-*.rpm
          rpm -qpl dist/hermit-*.rpm | grep -q '/usr/bin/hermit'
          rpm -qpl dist/hermit-*.rpm | grep -q '/hermit.service'
      - uses: actions/upload-artifact@v7
        with:
          name: hermit-fedora-rpm
          path: dist/hermit-*.rpm

  oauth-postgres18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - run: npm ci --prefix integration
      - name: PostgreSQL 18 OAuth validator end-to-end
        run: node integration/oauth/run.mjs
