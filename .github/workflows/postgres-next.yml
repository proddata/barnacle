name: PostgreSQL next major

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-next:
    name: PostgreSQL 19 beta compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Update this tag for each beta/RC, then move 19 into ci.yml after GA.
        image: postgres:19beta4-alpine
        env:
          POSTGRES_USER: barnacle
          POSTGRES_PASSWORD: barnacle_dev_password
          POSTGRES_DB: barnacle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barnacle -d barnacle"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - run: npm ci --prefix integration
      - name: Neon driver integration tests
        env:
          BARNACLE_PG_ADDR: 127.0.0.1:5432
          BARNACLE_PG_SSLMODE: disable
          BARNACLE_PG_USER: barnacle
          BARNACLE_PG_DATABASE: barnacle
          TEST_DATABASE_URL: postgres://barnacle:barnacle_dev_password@localhost:5432/barnacle
        run: ./integration/run.sh
