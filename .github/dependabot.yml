version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly, day: monday }
    groups:
      console-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /integration
    schedule: { interval: monthly }
    groups:
      integration-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  # Base images that track a CI matrix or the Go version are bumped by hand
  # together with it: postgres (ci.yml matrix, compose.yaml), fedora (RPM
  # matrix), node (console build), golang (go.mod and the RPM spec).
  - package-ecosystem: docker
    directories:
      - /
      - /console
      - /integration/pgcertgen
      - /integration/pgbouncer
      - /integration/fedora-service
    schedule: { interval: weekly, day: monday }
    groups:
      # One PR per image, covering every Dockerfile that uses it.
      docker-images:
        patterns: ["*"]
        group-by: dependency-name
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: fedora
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
