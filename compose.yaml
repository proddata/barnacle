name: barnacle

services:
  pgcertgen:
    build: ./integration/pgcertgen
    volumes:
      - pgcerts:/certs
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: barnacle
      POSTGRES_PASSWORD: barnacle_dev_password
      POSTGRES_DB: barnacle
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/pgcerts/server.crt", "-c", "ssl_key_file=/pgcerts/server.key"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barnacle -d barnacle"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/pgcerts:ro
    depends_on:
      pgcertgen:
        condition: service_completed_successfully
  barnacle:
    build: .
    environment:
      BARNACLE_LISTEN: ':8080'
      BARNACLE_TLS_CERT_FILE: '${BARNACLE_TLS_CERT_FILE:-}'
      BARNACLE_TLS_KEY_FILE: '${BARNACLE_TLS_KEY_FILE:-}'
      BARNACLE_PG_ADDR: '${BARNACLE_PG_ADDR-postgres:5432}'
      BARNACLE_PG_ALLOWED_ADDRS: '${BARNACLE_PG_ALLOWED_ADDRS-*}'
      BARNACLE_PG_SSLMODE: '${BARNACLE_PG_SSLMODE:-require}'
      BARNACLE_PG_QUERY_EXEC_MODE: '${BARNACLE_PG_QUERY_EXEC_MODE:-exec}'
      BARNACLE_PG_TLS_SERVER_NAME: '${BARNACLE_PG_TLS_SERVER_NAME:-}'
      BARNACLE_PG_CA_FILE: '${BARNACLE_PG_CA_FILE:-/pgcerts/ca.crt}'
      BARNACLE_PG_EXTRA_CA_FILE: '${BARNACLE_PG_EXTRA_CA_FILE:-}'
      BARNACLE_QUERY_TIMEOUT: '${BARNACLE_QUERY_TIMEOUT:-30s}'
      BARNACLE_HTTP_READ_TIMEOUT: '${BARNACLE_HTTP_READ_TIMEOUT:-15s}'
      BARNACLE_HTTP_WRITE_TIMEOUT: '${BARNACLE_HTTP_WRITE_TIMEOUT:-60s}'
      BARNACLE_HTTP_IDLE_TIMEOUT: '${BARNACLE_HTTP_IDLE_TIMEOUT:-60s}'
      BARNACLE_MAX_CONNECTIONS: '${BARNACLE_MAX_CONNECTIONS:-32}'
      BARNACLE_MAX_HTTP_QUERIES: '${BARNACLE_MAX_HTTP_QUERIES:-8}'
      BARNACLE_WS_IDLE_TIMEOUT: '${BARNACLE_WS_IDLE_TIMEOUT:-30m}'
      BARNACLE_WS_WRITE_TIMEOUT: '${BARNACLE_WS_WRITE_TIMEOUT:-30s}'
      BARNACLE_READY_PG_ADDR: '${BARNACLE_READY_PG_ADDR:-}'
      BARNACLE_METRICS: '${BARNACLE_METRICS:-true}'
      BARNACLE_METRICS_LISTEN: '${BARNACLE_METRICS_LISTEN:-:9090}'
      BARNACLE_HTTP_MAX_ROW_MIB: '${BARNACLE_HTTP_MAX_ROW_MIB:-8}'
      BARNACLE_HTTP_MAX_BUFFERED_MIB: '${BARNACLE_HTTP_MAX_BUFFERED_MIB:-4}'
      BARNACLE_HTTP_MAX_RESPONSE_MIB: '${BARNACLE_HTTP_MAX_RESPONSE_MIB:-128}'
      BARNACLE_OIDC_ISSUER: '${BARNACLE_OIDC_ISSUER:-}'
      BARNACLE_OIDC_AUDIENCE: '${BARNACLE_OIDC_AUDIENCE:-}'
      BARNACLE_ALLOWED_ORIGIN: '${BARNACLE_ALLOWED_ORIGIN:-}'
      BARNACLE_TRUSTED_PROXIES: '${BARNACLE_TRUSTED_PROXIES:-}'
      GOMEMLIMIT: 160MiB
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - pgcerts:/pgcerts:ro
      - ./console/certs:/console-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
  console:
    profiles: [console]
    build: ./console
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      barnacle:
        condition: service_started
volumes:
  pgdata:
  pgcerts:
